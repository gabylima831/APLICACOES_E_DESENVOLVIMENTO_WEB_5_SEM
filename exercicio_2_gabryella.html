<!--
Crie uma página html com 7 cards, iguais ao anterior com responsividade.
-->

<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<title>Lista de Usuários</title>

<style>

body{
    font-family:Arial;
    background:#f4f4f4;
    padding:30px;
}

.container{
    display:grid;
    grid-template-columns:repeat(auto-fit,minmax(300px,1fr));
    gap:20px;
}

.card{
    background:white;
    border-radius:10px;
    box-shadow:0 4px 10px rgba(0,0,0,0.2);
    display:flex;
    padding:15px;
    gap:15px;
}

.card img{
    width:100px;
    height:100px;
    border-radius:10px;
    object-fit:cover;
}

.nome{
    font-weight:bold;
    font-size:18px;
}

button{
    margin-top:5px;
    padding:6px 10px;
    border:none;
    border-radius:5px;
    cursor:pointer;
}

.seguir{background:#007bff;color:white;}
.positivo{background:#28a745;color:white;}
.negativo{background:#dc3545;color:white;}
.mensagem{background:#6c757d;color:white;}

</style>
</head>

<body>

<div class="container">

<!-- CARD 1 -->
<div class="card">
<img src="https://picsum.photos/200?1">
<div>
<div class="nome">Usuário 1</div>
<p>Descrição breve do usuário.</p>
<button class="seguir">Seguir</button>
<button class="positivo">+</button>
<button class="negativo">-</button>
<button class="mensagem">Msg</button>
